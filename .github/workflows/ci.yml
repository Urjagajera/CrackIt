name: CrackIt CI Pipeline

on:
  push:
    branches: [ main, master, staging ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-build:
    name: Lint, Audit & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root & Server Dependencies
        run: |
          npm ci
          cd server && npm ci

      - name: Run Code Linter (oxlint)
        run: npm run lint

      - name: Run Backend Syntax Verification
        run: |
          node --check server/src/index.js
          node --check server/src/app.js
          node --check server/scripts/verifyRLS.js

      - name: Build Vite Production Bundle
        run: npm run build
