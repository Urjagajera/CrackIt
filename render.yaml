services:
  # Express Backend + Real-time WebSocket Server
  - type: web
    name: crackit-backend
    env: node
    region: oregon
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: https://crackit-frontend.onrender.com,http://localhost:5173
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true

  # React Frontend (Vite Static Site)
  - type: static
    name: crackit-frontend
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://crackit-backend.onrender.com/api
      - key: VITE_WS_URL
        value: wss://crackit-backend.onrender.com/ws
